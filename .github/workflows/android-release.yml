name: Android APK Derle ve Otomatik Güncelleme Yayınla

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Proje Kodlarını İndir
        uses: actions/checkout@v4

      - name: Eski Dosya Kalıntılarını Temizle
        run: |
          find app/src/main/java/com -mindepth 1 -maxdepth 1 ! -name 'calismazamanlayici' -exec rm -rf {} + || true
          find app/keystore -type f ! -name 'release-key.jks' -delete || true
          find app/src/main/res/drawable -name 'ic_launcher_*.xml' -delete || true

      - name: JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle 8.5 Bağımsız Yansıma Sunucularından Kurulumu (504 Korumalı)
        run: |
          if curl -fsSL --connect-timeout 12 https://mirrors.cloud.tencent.com/gradle/gradle-8.5-bin.zip -o /tmp/gradle.zip; then
            echo "Tencent Cloud yansimasindan indirildi."
          elif curl -fsSL --connect-timeout 12 https://mirrors.aliyun.com/macports/distfiles/gradle/gradle-8.5-bin.zip -o /tmp/gradle.zip; then
            echo "Aliyun CDN yansimasindan indirildi."
          elif curl -fsSL --connect-timeout 12 https://repo.huaweicloud.com/gradle/gradle-8.5-bin.zip -o /tmp/gradle.zip; then
            echo "Huawei Cloud CDN yansimasindan indirildi."
          elif curl -fsSL --connect-timeout 12 https://downloads.gradle-dn.com/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip; then
            echo "Gradle CDN uzerinden indirildi."
          fi
          if [ -f /tmp/gradle.zip ]; then
            unzip -q /tmp/gradle.zip -d /tmp
          fi

      - name: Öğrenci ve Veli APK Dosyalarını Derle (Android 6+ Uyumlu)
        run: |
          if [ -x /tmp/gradle-8.5/bin/gradle ]; then
            /tmp/gradle-8.5/bin/gradle assembleRelease --no-daemon \
              -PversionCode=${{ github.run_number }} \
              -PversionName=4.0.${{ github.run_number }} \
              -PgithubRepo=${{ github.repository }}
          else
            sed -i "s/8.2.2/8.8.0/g" build.gradle
            gradle assembleRelease --no-daemon \
              -PversionCode=${{ github.run_number }} \
              -PversionName=4.0.${{ github.run_number }} \
              -PgithubRepo=${{ github.repository }}
          fi

      - name: APK Dosyalarını GitHub Actions Arşivine Yükle
        uses: actions/upload-artifact@v4
        with:
          name: CalismaZamanlayici-APKs-v4.0.${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/CalismaZamanlayici.apk
            veli/build/outputs/apk/release/CalismaZamanlayiciVeli.apk

      - name: GitHub Releases Üzerinde Her İki APK Sürümünü Yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.${{ github.run_number }}
          name: "Çalışma Zamanlayıcı & Veli Uygulaması v4.0.${{ github.run_number }}"
          body: |
            🚀 **Çalışma Zamanlayıcı (Öğrenci) & Veli Takip Uygulaması - Otomatik Güncelleme Paketi**
            - **Sürüm:** `v4.0.${{ github.run_number }}`
            - **Öğrenci APK:** `CalismaZamanlayici.apk`
            - **Veli APK:** `CalismaZamanlayiciVeli.apk`
            - **Minimum Android Sürümü:** Android 6.0 (API 23) ve üzeri
            - Sabit imza (`release-key.jks`) ile imzalanmıştır; her iki uygulama da kendi güncellemelerini GitHub üzerinden otomatik bulup verileri silmeden üzerine kurar.
          files: |
            app/build/outputs/apk/release/CalismaZamanlayici.apk
            veli/build/outputs/apk/release/CalismaZamanlayiciVeli.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
