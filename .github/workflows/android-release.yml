name: Android APK Derle ve Otomatik Güncelleme Yayınla

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Proje Kodlarını İndir
        uses: actions/checkout@v4

      - name: Eski Dosya Kalıntılarını Temizle
        run: |
          find app/src/main/java/com -mindepth 1 -maxdepth 1 ! -name 'calismazamanlayici' -exec rm -rf {} + || true
          find app/keystore -type f ! -name 'release-key.jks' -delete || true
          find app/src/main/res/drawable -name 'ic_launcher_*.xml' -delete || true

      - name: JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle 8.5 Kurulumu
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Öğrenci ve Veli APK Dosyalarını Derle (Android 6+ Uyumlu)
        run: |
          gradle assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=3.0.${{ github.run_number }} \
            -PgithubRepo=${{ github.repository }}

      - name: APK Dosyalarını GitHub Actions Arşivine Yükle
        uses: actions/upload-artifact@v4
        with:
          name: CalismaZamanlayici-APKs-v3.0.${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/CalismaZamanlayici.apk
            veli/build/outputs/apk/release/CalismaZamanlayiciVeli.apk

      - name: GitHub Releases Üzerinde Her İki APK Sürümünü Yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: "Çalışma Zamanlayıcı & Veli Uygulaması v3.0.${{ github.run_number }}"
          body: |
            🚀 **Çalışma Zamanlayıcı (Öğrenci) & Veli Takip Uygulaması - Otomatik Güncelleme Paketi**
            - **Sürüm:** `v3.0.${{ github.run_number }}`
            - **Öğrenci APK:** `CalismaZamanlayici.apk`
            - **Veli APK:** `CalismaZamanlayiciVeli.apk`
            - **Minimum Android Sürümü:** Android 6.0 (API 23) ve üzeri
            - Sabit imza (`release-key.jks`) ile imzalanmıştır; her iki uygulama da kendi güncellemelerini GitHub üzerinden otomatik bulup verileri silmeden üzerine kurar.
          files: |
            app/build/outputs/apk/release/CalismaZamanlayici.apk
            veli/build/outputs/apk/release/CalismaZamanlayiciVeli.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
