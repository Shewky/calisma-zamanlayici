name: Android APK Derle ve Otomatik Güncelleme Yayınla

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Proje Kodlarını İndir
        uses: actions/checkout@v4

      - name: Eski Dosya Kalıntılarını Temizle
        run: |
          find app/src/main/java/com -mindepth 1 -maxdepth 1 ! -name 'calismazamanlayici' -exec rm -rf {} + || true
          find app/keystore -type f ! -name 'release-key.jks' -delete || true
          find app/src/main/res/drawable -name 'ic_launcher_*.xml' -delete || true

      - name: JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle 8.5 Kurulumu
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: İmzalı APK Derle (Android 6+ Uyumlu Global Sürüm)
        run: |
          gradle assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=2.0.${{ github.run_number }} \
            -PgithubRepo=${{ github.repository }}

      - name: APK Dosyasını GitHub Actions Arşivine Yükle
        uses: actions/upload-artifact@v4
        with:
          name: CalismaZamanlayici-APK-v2.0.${{ github.run_number }}
          path: app/build/outputs/apk/release/CalismaZamanlayici.apk

      - name: GitHub Releases Üzerinde Yeni Sürüm Yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "Çalışma Zamanlayıcı v2.0.${{ github.run_number }}"
          body: |
            🚀 **Çalışma Zamanlayıcı - Otomatik Güncelleme Paketi (Global Sürüm)**
            - **Sürüm:** `v2.0.${{ github.run_number }}`
            - **Yapı Numarası:** `${{ github.run_number }}`
            - **Minimum Android Sürümü:** Android 6.0 (API 23) ve üzeri
            - Sabit imza (`release-key.jks`) ile imzalanmıştır; mevcut uygulamanın üzerine veriler silinmeden doğrudan güncellenir.
          files: app/build/outputs/apk/release/CalismaZamanlayici.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
